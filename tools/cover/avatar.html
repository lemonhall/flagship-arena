<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* X avatar. Rendered at 512x512 by tools/cover/render-brand.mjs.
     X crops avatars to a circle, so everything sits well inside a 340px disc. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body { display: grid; place-items: center; background: radial-gradient(120% 120% at 50% 28%, #12414a 0%, #061923 72%); }
  .badge {
    width: 340px; height: 340px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(160deg, #10404a 0%, #061923 100%);
    box-shadow: 0 0 0 12px rgba(240, 200, 119, .16), 0 18px 50px rgba(0, 0, 0, .55);
  }
  .badge img { width: 196px; height: 196px; }
</style>
</head>
<body>
  <div class="badge"><img src="../../public/icon.svg" alt="" /></div>
</body>
</html>
